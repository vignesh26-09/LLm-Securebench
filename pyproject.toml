[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securellmbench"
version = "0.1.0"
description = "A modular benchmark framework for evaluating the security of large language models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SecureLLMBench Contributors" }]
dependencies = [
    "fastapi>=0.110,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.27,<1",
    "psycopg[binary]>=3,<4",
    "httpx>=0.27,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
semantic = [
    "sentence-transformers>=3,<4",
    "scikit-learn>=1.4,<2",
]
hdbscan = ["hdbscan>=0.8,<1"]
transformers = ["transformers>=4.40,<6", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
